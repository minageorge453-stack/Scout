<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول · كشافة كنائس زايد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css">
<style>
  .demo-creds {
    margin-top: 16px;
    padding: 14px 16px;
    background: linear-gradient(135deg, rgba(45, 138, 150, 0.06), rgba(255, 107, 91, 0.04));
    border-radius: 12px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
    border-right: 3px solid var(--teal);
  }
  .demo-creds strong { color: var(--teal-deep); font-weight: 700; }
  .demo-creds code {
    font-family: monospace;
    background: #fff;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    direction: ltr;
    display: inline-block;
    color: var(--indigo);
  }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="hero-logos hero-logos--sm">
        <div class="hero-logo">
          <img src="assets/logos/logo_anba_samuel.webp" alt="كنيسة العذراء والأنبا صموئيل">
          <div class="name">كنيسـة العذراء<br>والأنبا صموئيـل</div>
        </div>
        <div class="hero-logo hero-logo--gold">
          <img src="assets/logos/logo_scout.webp" alt="كشافة كنائس زايد">
        </div>
        <div class="hero-logo">
          <img src="assets/logos/logo_pope_kyrillos.webp" alt="كنيسة العذراء والبابا كيرلس السادس">
          <div class="name">كنيسـة العذراء<br>والبابا كيرلـس السـادس</div>
        </div>
      </div>
      <h1>كشافة كنائس زايد</h1>
      <p>ZAYED SCOUT GROUPS · SEASON 2026</p>
    </div>

    <div class="form-error" id="err"></div>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="email">البريد الإلكتروني</label>
        <input
          type="email"
          id="email"
          class="form-input"
          placeholder="example@zayedscout.org"
          required
          autocomplete="email"
          dir="ltr"
          style="text-align: left;"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">كلمة المرور</label>
        <input
          type="password"
          id="password"
          class="form-input"
          placeholder="••••••••"
          required
          autocomplete="current-password"
          dir="ltr"
          style="text-align: left;"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
        تسجيل الدخول
      </button>
    </form>

    <div class="demo-creds">
      <strong>للتجربة:</strong><br>
      • قائد عام: <code>admin@zayedscout.org</code> / <code>admin2026</code><br>
      • قائد قطاع: <code>advanced@zayedscout.org</code> / <code>scout2026</code>
    </div>

    <div class="auth-foot">
      «لاَ يَغْلِبَنَّكَ الشَّرُّ، بَلِ اغْلِبِ الشَّرَّ بِالْخَيْرِ»
    </div>

  </div>
</div>

<!-- Load zs.js but handle failure gracefully -->
<script>
  // ── Hardcoded users (fallback — always works even if localStorage fails) ──
  const USERS = [
    { id: 'u_admin', name: 'القائد العام', email: 'admin@zayedscout.org', password: 'admin2026', role: 'admin', sector: 'all', avatar: 'ق' },
    { id: 'u_leader_advanced', name: 'قائد قطاع متقدم', email: 'advanced@zayedscout.org', password: 'scout2026', role: 'sector_leader', sector: 'advanced', avatar: 'م' }
  ];

  // ── Safe localStorage helpers ──
  function storageGet(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
  function storageSet(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

  // ── Seed users if not already in storage ──
  if (!storageGet('zs_users')) {
    storageSet('zs_users', JSON.stringify(USERS));
  }

  // ── Check if already logged in ──
  const existing = storageGet('zs_current_user');
  if (existing) {
    window.location.href = 'dashboard.html';
  }

  // ── Login handler ──
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const email    = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const errBox   = document.getElementById('err');

    errBox.classList.remove('show');
    errBox.textContent = '';

    // Always check against hardcoded USERS (reliable) + any stored users
    let users = USERS;
    try {
      const stored = storageGet('zs_users');
      if (stored) users = JSON.parse(stored);
    } catch(e) {
      users = USERS;
    }

    const user = users.find(function(u) {
      return u.email.toLowerCase() === email && u.password === password;
    });

    if (!user) {
      errBox.textContent = 'الإيميل أو الباسورد غير صحيح';
      errBox.classList.add('show');
      return;
    }

    // Save session (without password)
    const safe = { id: user.id, name: user.name, email: user.email, role: user.role, sector: user.sector, avatar: user.avatar };
    storageSet('zs_current_user', JSON.stringify(safe));

    // Also tell ZS about it if the library loaded
    if (window.ZS) {
      window.ZS._memSession = safe;
    }

    window.location.href = 'dashboard.html';
  });
</script>

<!-- Load zs.js after our inline logic (non-blocking) -->
<script src="assets/zs.js"></script>

</body>
</html>
